<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso Conductor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-bg">
<div class="card login-card">
    <h2>🚌 Bus Control</h2>
    <input type="text" id="busId" placeholder="ID del Autobús">
    <input type="password" id="pass" placeholder="Contraseña">
    <button class="primary-btn" onclick="validar()">Entrar</button>
</div>

<script>
    async function validar() {
        const bus = document.getElementById('busId').value;
        const p = document.getElementById('pass').value;

        if(!bus || !p) return alert("Rellena los campos");

        const resp = await fetch('/api/conductor/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ busId: bus, password: p })
        });

        if (resp.ok) {
            localStorage.setItem('bus_id', bus);
            window.location.href = 'panel.html';
        } else {
            alert("Credenciales incorrectas");
        }
    }
</script>
</body>
</html>
